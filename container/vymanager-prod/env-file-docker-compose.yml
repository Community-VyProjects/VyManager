services:
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vymanager_secure_password}
      POSTGRES_DB: vymanager_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/community-vyprojects/vymanager-backend:beta
    container_name: vymanager-backend
    environment:
      DATABASE_URL: postgresql://vymanager:${POSTGRES_PASSWORD:-vymanager_secure_password}@postgres:5432/vymanager_auth
      FRONTEND_URL: ${FRONTEND_URL}
    restart: unless-stopped
    networks:
      - vymanager-network
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/community-vyprojects/vymanager-frontend:beta
    container_name: vymanager-frontend
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-ChangeMeToSomethingSecure123}
      NODE_ENV: production
      VYMANAGER_ENV: production
      BETTER_AUTH_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_API_URL: http://backend:8000
      DATABASE_URL: postgresql://vymanager:${POSTGRES_PASSWORD:-vymanager_secure_password}@postgres:5432/vymanager_auth
      TRUSTED_ORIGINS: ${FRONTEND_URL}
    restart: unless-stopped
    networks:
      - vymanager-network
      - dokploy-network
    depends_on:
      - backend

networks:
  vymanager-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
    driver: local
