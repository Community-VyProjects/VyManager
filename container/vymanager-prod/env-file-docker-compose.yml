# Pre-compiled images
services:
  # PostgreSQL Database for Authentication
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: vymanager_secure_password
      POSTGRES_DB: vymanager_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration runner: applies Prisma migrations before the
  # backend serves and before the frontend starts. The frontend
  # entrypoint still runs migrate deploy itself (harmless no-op here) so
  # non-compose deployments keep working.
  migrate:
    image: ghcr.io/community-vyprojects/vymanager-frontend:beta
    container_name: vymanager-migrate
    entrypoint: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy"]
    env_file:
      - ../../frontend/.env
    restart: "no"
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/community-vyprojects/vymanager-backend:beta
    container_name: vymanager-backend
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
    environment:
      SSH_ENCRYPTION_KEY: "${SSH_ENCRYPTION_KEY:?SSH_ENCRYPTION_KEY must be set}"
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/community-vyprojects/vymanager-frontend:beta
    container_name: vymanager-frontend
    env_file:
      - ../../frontend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  vymanager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local