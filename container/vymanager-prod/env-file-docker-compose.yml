# ==============================================================================
# VyManager Production - Docker Compose with Traefik
# ==============================================================================
#
# WHAT TO CHANGE:
# 1. Lines with Host(`example.com`) - Replace with your actual domain
# 2. PostgreSQL password (POSTGRES_PASSWORD) - Change for production
#
# QUICK START:
# 1. cp ../../.env.example ../../.env && nano ../../.env
# 2. Update domain in this file (search/replace example.com)
# 3. docker compose -f env-file-docker-compose.yml up -d
#
# ==============================================================================
services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik
    container_name: vymanager-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - vymanager-network
    labels:
      - "traefik.enable=true"
      # Dashboard (optional - access via https://example.com/traefik/)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`example.com`) && PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      # Basic auth for dashboard (user: admin, password: changeme) - generate new hash with: htpasswd -nb admin yourpassword
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$xyz$$changethishash"
      - "traefik.docker.network=vymanager-prod_vymanager-network"
    command:
      - "--configFile=/traefik.yml"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

  # PostgreSQL Database for Authentication
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: vymanager_secure_password
      POSTGRES_DB: vymanager_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/community-vyprojects/vymanager-backend:beta
    container_name: vymanager-backend
    expose:
      - "8000"
    env_file:
      - ../../.env
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # API routes - /vyos/*, /dashboard/*, /user-management/*, /session/*
      - "traefik.http.routers.backend.rule=Host(`example.com`) && (PathPrefix(`/vyos`) || PathPrefix(`/dashboard`) || PathPrefix(`/user-management`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/session`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=secure-headers@file"
      - "traefik.docker.network=vymanager-prod_vymanager-network"

  frontend:
    image: ghcr.io/community-vyprojects/vymanager-frontend:beta
    container_name: vymanager-frontend
    env_file:
      - ../../.env
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`example.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=secure-headers@file"
      # Set priority lower so backend routes match first
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.docker.network=vymanager-prod_vymanager-network"

networks:
  vymanager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local