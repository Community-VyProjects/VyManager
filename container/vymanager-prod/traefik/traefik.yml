# ==============================================================================
# Traefik Static Configuration for VyManager
# ==============================================================================
#
# This file configures Traefik as a reverse proxy with automatic HTTPS.
# The ACME_EMAIL for Let's Encrypt is set via docker-compose command args.
#
# BEFORE STARTING:
# 1. Ensure your domain DNS points to this server
# 2. Ensure ports 80 and 443 are open and accessible from the internet
# 3. Create the acme.json file:
#    touch letsencrypt/acme.json && chmod 600 letsencrypt/acme.json
#
# ==============================================================================

api:
  dashboard: true
  insecure: false

# ------------------------------------------------------------------------------
# Entry Points - Where Traefik listens for incoming connections
# ------------------------------------------------------------------------------
entryPoints:
  # HTTP (Port 80) - Automatically redirects to HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  # HTTPS (Port 443) - Main entry point for all traffic
  websecure:
    address: ":443"

# ------------------------------------------------------------------------------
# Providers - Where Traefik discovers services to route to
# ------------------------------------------------------------------------------
providers:
  # Docker provider - Automatically discovers containers with traefik labels
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: vymanager-prod_vymanager-network
  # File provider - Loads middleware configuration from /dynamic folder
  file:
    directory: /dynamic
    watch: true

# ------------------------------------------------------------------------------
# SSL/TLS Certificates - Automatic HTTPS via Let's Encrypt
# ------------------------------------------------------------------------------
# Note: The email is set via docker-compose command argument
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      # HTTP challenge - Traefik proves domain ownership via port 80
      httpChallenge:
        entryPoint: web

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
log:
  level: INFO  # Options: DEBUG, INFO, WARN, ERROR

# Access logs - Logs every request (useful for debugging)
accessLog: {}
