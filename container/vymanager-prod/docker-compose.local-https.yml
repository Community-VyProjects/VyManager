# ==============================================================================
# VyManager Production - Docker Compose with Local HTTPS (Self-Signed/Custom Cert)
# ==============================================================================
#
# Use this for LOCAL NETWORK deployments where you don't have a public domain.
# Works with local IPs (e.g., 192.168.1.100) using self-signed or custom certs.
#
# QUICK START:
# 1. cp ../../.env.example ../../.env
# 2. Edit ../../.env - set your local IP and generate BETTER_AUTH_SECRET
# 3. Generate self-signed cert OR add your own (see CERTIFICATES section below)
# 4. docker compose -f docker-compose.local-https.yml up -d
#
# CERTIFICATES:
# Option A - Generate self-signed certificate:
#   mkdir -p certs
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout certs/server.key -out certs/server.crt \
#     -subj "/CN=192.168.1.100" \
#     -addext "subjectAltName=IP:192.168.1.100"
#
# Option B - Use your own certificate:
#   Place your files in the certs/ folder:
#   - certs/server.crt (certificate)
#   - certs/server.key (private key)
#
# NOTE: Browsers will show a security warning for self-signed certs.
# You can add the cert to your system's trusted certificates to avoid this.
#
# ==============================================================================
services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik
    container_name: vymanager-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik-local.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./certs:/certs:ro
    environment:
      - DOMAIN=${DOMAIN}
    networks:
      - vymanager-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vymanager-prod_vymanager-network"
    command:
      - "--configFile=/traefik.yml"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

  # PostgreSQL Database for Authentication
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: vymanager_secure_password
      POSTGRES_DB: vymanager_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/community-vyprojects/vymanager-backend:beta
    container_name: vymanager-backend
    expose:
      - "8000"
    env_file:
      - ../../.env
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # API routes - /vyos/*, /dashboard/*, /user-management/*, /session/*
      - "traefik.http.routers.backend.rule=Host(${DOMAIN}) && (PathPrefix(`/vyos`) || PathPrefix(`/dashboard`) || PathPrefix(`/user-management`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/session`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=secure-headers@file"
      - "traefik.docker.network=vymanager-prod_vymanager-network"

  frontend:
    image: ghcr.io/community-vyprojects/vymanager-frontend:beta
    container_name: vymanager-frontend
    env_file:
      - ../../.env
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(${DOMAIN})"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=secure-headers@file"
      # Set priority lower so backend routes match first
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.docker.network=vymanager-prod_vymanager-network"

networks:
  vymanager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
