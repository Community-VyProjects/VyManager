services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik
    container_name: vymanager-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../vymanager-prod/traefik/traefik.yml:/traefik.yml:ro
      - ../vymanager-prod/traefik/dynamic:/dynamic:ro
      - ../vymanager-prod/letsencrypt:/letsencrypt
    networks:
      - vymanager-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vymanager-dev_vymanager-network"
    command:
      - "--configFile=/traefik.yml"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

  # PostgreSQL Database for Authentication
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: vymanager_secure_password
      POSTGRES_DB: vymanager_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vymanager-backend
    expose:
      - "8000"
    volumes:
      - ../../backend:/app
      - /app/lib
      - /app/bin
      - /app/include
    env_file:
      - ../../.env
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`infra.vyprojects.org`) && (PathPrefix(`/vyos`) || PathPrefix(`/dashboard`) || PathPrefix(`/user-management`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/session`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=vymanager-dev_vymanager-network"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: vymanager-frontend
    expose:
      - "3000"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ../../.env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vymanager-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`infra.vyprojects.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.docker.network=vymanager-dev_vymanager-network"

networks:
  vymanager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
