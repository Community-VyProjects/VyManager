services:
  # PostgreSQL Database for Authentication
  postgres:
    image: postgres:16-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: vymanager
      POSTGRES_PASSWORD: vymanager_secure_password
      POSTGRES_DB: vymanager_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vymanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymanager -d vymanager_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration runner: applies Prisma migrations before the
  # backend serves and before the frontend starts (the backend healthcheck
  # used to gate the frontend, which ran the migrations — so on upgrades
  # the backend served against the old schema until the frontend came up).
  migrate:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: vymanager-migrate
    entrypoint: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy"]
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ../../frontend/.env
    restart: "no"
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vymanager-backend
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - /app/lib
      - /app/bin
      - /app/include
    env_file:
      - ../../backend/.env
    environment:
      SSH_ENCRYPTION_KEY: "${SSH_ENCRYPTION_KEY:?SSH_ENCRYPTION_KEY must be set}"
    restart: unless-stopped
    networks:
      - vymanager-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: vymanager-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ../../frontend/.env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vymanager-network

networks:
  vymanager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
