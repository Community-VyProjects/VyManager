apiVersion: v1
kind: Service
metadata:
  name: {{ include "vymanager.fullname" . }}-frontend
  labels:
    {{- include "vymanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "vymanager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

