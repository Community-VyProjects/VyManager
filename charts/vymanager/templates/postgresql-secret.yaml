{{- if eq .Values.database.mode "internal" }}
{{- $secretName := include "vymanager.databaseSecretName" . -}}
{{- $password := randAlphaNum 32 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vymanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.database.internal.auth.username $password (include "vymanager.postgresqlServiceName" .) .Values.database.internal.service.port .Values.database.internal.auth.database | quote }}
{{- end }}

