{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vymanager.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "vymanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- with .Values.migrations.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "vymanager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
        {{- with .Values.migrations.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.migrations.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "vymanager.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.migrations.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "vymanager.migrationImage" . | quote }}
          imagePullPolicy: {{ include "vymanager.migrationPullPolicy" . }}
          command:
            - sh
            - -c
            - >-
              {{- if eq .Values.database.mode "internal" }}
              until nc -z {{ include "vymanager.postgresqlServiceName" . }} {{ .Values.database.internal.service.port }}; do sleep 2; done;
              {{- end }}
              npx prisma generate && npx prisma migrate deploy
          securityContext:
            {{- toYaml .Values.migrations.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vymanager.databaseSecretName" . }}
                  key: {{ include "vymanager.databaseUrlSecretKey" . }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

