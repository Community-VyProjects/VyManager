{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vymanager.fullname" . }}-test-connection
  labels:
    {{- include "vymanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: {{ printf "%s:%s" .Values.tests.image.repository .Values.tests.image.tag | quote }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - wget
      args:
        - {{ printf "http://%s-frontend:%v/" (include "vymanager.fullname" .) .Values.frontend.service.port | quote }}
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
{{- end }}
