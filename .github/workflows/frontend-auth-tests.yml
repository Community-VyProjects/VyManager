name: Frontend auth tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-auth-tests.yml'
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run login-rate-limit.test.ts and login-rate-limit-route.test.ts
        working-directory: frontend
        run: npm run test:auth

      - name: Run HTTPS save op tests
        working-directory: frontend
        run: npm run test:https-save
