name: Frontend auth tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-auth-tests.yml'
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run login-rate-limit.test.ts and login-rate-limit-route.test.ts
        working-directory: frontend
        run: npm run test:auth

      - name: Run HTTPS save op tests
        working-directory: frontend
        run: npm run test:https-save

      - name: Run static routes save op tests
        working-directory: frontend
        run: npm run test:static-routes-save

      - name: Run OSPF save op tests
        working-directory: frontend
        run: npm run test:ospf-save

      - name: Run IS-IS save op tests
        working-directory: frontend
        run: npm run test:isis-save

      - name: Run power schedule tests
        working-directory: frontend
        run: npm run test:power-schedule

      - name: Run L2TP PPP options save op tests
        working-directory: frontend
        run: npm run test:l2tp-ppp-save

      - name: Run NAT64 save op tests
        working-directory: frontend
        run: npm run test:nat64-save

      - name: Run NAT66 save op tests
        working-directory: frontend
        run: npm run test:nat66-save

      - name: Run VRF RPKI save op tests
        working-directory: frontend
        run: npm run test:vrf-rpki-save

      - name: Run VRF schema save op tests
        working-directory: frontend
        run: npm run test:vrf-schema-save

      - name: Run RIP save op tests
        working-directory: frontend
        run: npm run test:rip-save

      - name: Run conntrack-sync save op tests
        working-directory: frontend
        run: npm run test:conntrack-sync-save

      - name: Run high-availability save op tests
        working-directory: frontend
        run: npm run test:high-availability-save

      - name: Run flowtables save op tests
        working-directory: frontend
        run: npm run test:flowtables-save

      - name: Run service monitoring save op tests
        working-directory: frontend
        run: npm run test:service-monitoring-save

      - name: Run IPoE server save op tests
        working-directory: frontend
        run: npm run test:ipoe-server-save

      - name: Run PPPoE server save op tests
        working-directory: frontend
        run: npm run test:pppoe-server-save

      - name: Run container save op tests
        working-directory: frontend
        run: npm run test:container-save

      - name: Run MACsec save op tests
        working-directory: frontend
        run: npm run test:macsec-save

      - name: Run VXLAN save op tests
        working-directory: frontend
        run: npm run test:vxlan-save

      - name: Run failover save op tests
        working-directory: frontend
        run: npm run test:failover-save

      - name: Run firewall global-options save op tests
        working-directory: frontend
        run: npm run test:firewall-global-options-save

      - name: Run policy route save op tests
        working-directory: frontend
        run: npm run test:route-save

      - name: Run PKI save op and dialog tests
        working-directory: frontend
        run: npm run test:pki-save

      - name: Run policy screen tests
        working-directory: frontend
        run: npm run test:policies

      - name: Run WireGuard form tests
        working-directory: frontend
        run: npm run test:wireguard-form

      - name: Run DHCP server screen tests
        working-directory: frontend
        run: npm run test:dhcp-server
