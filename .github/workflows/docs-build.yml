name: Docs build

# Builds the docs site from FastAPI's live OpenAPI export. Authors do not
# commit generated spec files. A route change that breaks app.openapi() or
# the docs build fails here instead of a snapshot diff.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs-site/**'
      - '.github/workflows/docs-build.yml'

jobs:
  docs:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Export OpenAPI spec from the app
        working-directory: backend
        run: python export_openapi.py

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        env:
          SKIP_OPENAPI_EXPORT: '1'
        run: npm run build
